name: Flutter checks and Android APK

on:
  push:
    branches: [master, 'codex/**']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examhub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format review sources
        run: dart format lib test
      - name: Upload formatted review sources
        uses: actions/upload-artifact@v7.0.2
        with:
          name: examhub-formatted-${{ github.run_number }}
          path: |
            lib/
            test/
          retention-days: 2
      - name: Test lightweight assistant service
        run: node --test server/test/*.test.mjs
      - name: Analyze
        run: flutter analyze
      - name: Download Chinese font for UI tests only
        run: |
          mkdir -p .test-fonts
          curl --fail --location --retry 2 'https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' -o .test-fonts/cjk.otf
      - name: Run business and migration tests
        run: flutter test --reporter expanded
      - name: Upload real UI previews
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: examhub-ui-${{ github.run_number }}
          path: build/ui-previews/
          retention-days: 7
          if-no-files-found: ignore
      - name: Set up Java
        if: github.event_name != 'pull_request'
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        if: github.event_name != 'pull_request'
        uses: android-actions/setup-android@v4.0.4
      - name: Install Android build components
        if: github.event_name != 'pull_request'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Build optimized Android ARM64 APK
        if: github.event_name != 'pull_request'
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --split-debug-info=build/dart-symbols
      - name: Prepare download
        if: github.event_name != 'pull_request'
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_RUN: ${{ github.run_number }}
        run: |
          mkdir -p delivery
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk 'delivery/考试通安卓精简版.apk'
          cd delivery
          sha256sum '考试通安卓精简版.apk' > '安装包校验.txt'
          printf '考试通 Android ARM64 精简测试版（Release 优化）\nCommit: %s\nRun: %s\n调试签名，不用于商店发布；跨构建签名可能变化。\n' "$BUILD_COMMIT" "$BUILD_RUN" > '构建信息.txt'
      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: examhub-android-release-${{ github.run_number }}
          path: delivery/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Preserve Dart symbols
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: examhub-dart-symbols-${{ github.run_number }}
          path: build/dart-symbols/
          retention-days: 7
          if-no-files-found: error
      - name: Build summary
        if: success() && github.event_name != 'pull_request'
        run: |
          echo '### Android 测试包已生成' >> "$GITHUB_STEP_SUMMARY"
          echo '请在本次运行的 Artifacts 中下载 APK。仅构建测试包，未自动部署到服务器。' >> "$GITHUB_STEP_SUMMARY"
