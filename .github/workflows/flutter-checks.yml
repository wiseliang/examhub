name: Flutter checks and Android APK

on:
  push:
    branches: [master, 'codex/**']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examhub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Run business and migration tests
        run: flutter test --reporter expanded
      - name: Set up Java
        if: github.event_name != 'pull_request'
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        if: github.event_name != 'pull_request'
        uses: android-actions/setup-android@v4.0.4
      - name: Install Android build components
        if: github.event_name != 'pull_request'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Build Android ARM64 test APK
        if: github.event_name != 'pull_request'
        run: flutter build apk --debug --target-platform android-arm64
      - name: Prepare download
        if: github.event_name != 'pull_request'
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_RUN: ${{ github.run_number }}
        run: |
          mkdir -p delivery
          cp build/app/outputs/flutter-apk/app-debug.apk 'delivery/考试通安卓测试版.apk'
          cd delivery
          sha256sum '考试通安卓测试版.apk' > '安装包校验.txt'
          printf '考试通 Android ARM64 测试版\nCommit: %s\nRun: %s\n调试签名，不用于商店发布；跨构建签名可能变化。\n' "$BUILD_COMMIT" "$BUILD_RUN" > '构建信息.txt'
      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: examhub-android-debug-${{ github.run_number }}
          path: delivery/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Build summary
        if: success() && github.event_name != 'pull_request'
        run: |
          echo '### Android 测试包已生成' >> "$GITHUB_STEP_SUMMARY"
          echo '请在本次运行的 Artifacts 中下载 APK。仅构建测试包，未自动部署到服务器。' >> "$GITHUB_STEP_SUMMARY"
